/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    extraPackagerArgs = ["--dev", "false", "--minify", "true", "--reset-cache"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.musicaura"
    defaultConfig {
        applicationId "com.musicaura"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "2.0.0"
        multiDexEnabled true
        resConfigs "en"
        // Limit ABIs for a smaller universal APK (arm devices)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    // Exclude native InnerTube original files (they reference unavailable libs)
    sourceSets {
        main {
            java {
                exclude '**/InnerTubeModule.kt'
                // Exclude partially copied native InnerTube sources until they're validated
                exclude '**/zionhuang/**'
                exclude '**/com/zionhuang/**'
            }
        }
    }
    
    // Java 8 Desugaring Support
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
         release {
                    if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                        storeFile file(MYAPP_UPLOAD_STORE_FILE)
                        storePassword MYAPP_UPLOAD_STORE_PASSWORD
                        keyAlias MYAPP_UPLOAD_KEY_ALIAS
                        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                    }
         }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Use release signing for debug builds to avoid scan prompt
            signingConfig signingConfigs.release
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            shrinkResources enableProguardInReleaseBuilds
            // Strip native debug symbols to reduce APK size
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Enable ABI splits to produce multiple APKs and a single universal APK
    // Setting universalApk to true creates a single APK containing all selected architectures
    splits {
        abi {
            enable false
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            pickFirsts += ['**/libjsc.so', '**/libc++_shared.so', '**/libhermes.so', '**/libhermes-executor-debug.so', '**/libhermes-executor-release.so']
            // Exclude common metadata, notices and licenses to reduce size
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE',
                'META-INF/LICENSE.*',
                'META-INF/NOTICE',
                'META-INF/NOTICE.*',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation("com.facebook.react:react-android")
    // Only include Flipper in debug builds; exclude from release to save size
    debugImplementation("com.facebook.react:flipper-integration")
    implementation ('com.facebook.fresco:fresco:2.0.0')
    implementation ('com.facebook.fresco:animated-gif:2.0.0')
    
    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    
    // YouTube Music Streaming Dependencies
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.24.8"
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation "io.ktor:ktor-client-okhttp:2.3.6"
    implementation "io.ktor:ktor-client-core:2.3.6"
    implementation "io.ktor:ktor-client-content-negotiation:2.3.6"
    implementation "io.ktor:ktor-serialization-kotlinx-json:2.3.6"
    implementation "io.ktor:ktor-client-encoding:2.3.6"
    implementation "org.brotli:dec:0.1.2"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"
    // OuterTune InnerTube (via JitPack) - commented out due to unavailability
    // implementation 'com.github.zionhuang:innertube:0.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Handle AndroidX migration conflicts
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.annotation:annotation:1.7.0'
        force 'androidx.media:media:1.6.0'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.activity:activity:1.8.0'
        force 'androidx.activity:activity-ktx:1.8.0'
        force 'androidx.fragment:fragment:1.6.2'
        force 'androidx.fragment:fragment-ktx:1.6.2'
        force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
        force 'androidx.lifecycle:lifecycle-common:2.6.2'
    }
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-v4'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

apply plugin: 'com.google.gms.google-services'

// Fix for react-native-vector-icons task dependency
afterEvaluate {
    def copyTask = tasks.findByName('copyReactNativeVectorIconFonts')
    def lintTask = tasks.findByName('generateReleaseLintVitalReportModel')
    if (copyTask != null && lintTask != null) {
        lintTask.mustRunAfter copyTask
        lintTask.dependsOn copyTask
    }
    
    tasks.matching { it.name.startsWith('generate') && it.name.contains('Lint') }.all {
        if (copyTask != null) {
            it.mustRunAfter copyTask
        }
    }
    
    tasks.matching { it.name.startsWith('process') && it.name.contains('Resources') }.all {
        if (copyTask != null) {
            it.dependsOn copyTask
        }
    }
}
