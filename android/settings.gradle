rootProject.name = 'music-aura'

// Apply native modules settings with filtering
def nodeModulesPath = new File(rootProject.projectDir, '../node_modules')
apply from: new File(nodeModulesPath, '@react-native-community/cli-platform-android/native_modules.gradle'); applyNativeModulesSettingsGradle(settings)
include ':app'
include ':react-native-fetch-blob'
project(':react-native-fetch-blob').projectDir = new File(nodeModulesPath, 'react-native-fetch-blob/android')
includeBuild(new File(nodeModulesPath, '@react-native/gradle-plugin'))

// Add these lines to fix the dependency issues
gradle.beforeProject { project ->
    project.extensions.extraProperties.set('android.useAndroidX', true)
    project.extensions.extraProperties.set('android.enableJetifier', true)
}